name: Deploy to GitHub Pages
on:
  push:
    branches: [main] # Se activa al sincronizar la rama principal
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - uses: actions/deploy-pages@v4 # Despliega la carpeta /dist automáticamente
